# Crowdin project configuration. https://support.crowdin.com/configuration-file/
# Source strings: one POT per film, generated by tools/export_po.py from data/films/<slug>/cards.yaml.
# Translations: one PO per film per language, written back by Crowdin (GitHub integration
# opens a PR on the l10n branch; merge it and run tools/lint.py).
"project_id": 925929        # crowdin.com/project/intertitles; the pipeline tools read it from here
"preserve_hierarchy": true
files:
  - source: /data/locales/templates/*.pot
    translation: /data/locales/%locale%/%file_name%.po
    ignore:
      - /data/locales/templates/_example.pot   # test fixture, not a film
    # Crowdin locale codes: es-MX for Mexican Spanish. %locale% keeps the region.
