# Crowdin project configuration. https://support.crowdin.com/configuration-file/
# Source strings: one POT per film, generated by tools/export_po.py from films/<slug>/cards.yaml.
# Translations: one PO per film per language, written back by Crowdin (GitHub integration
# opens a PR on the l10n branch; merge it and run tools/lint.py).
"preserve_hierarchy": true
files:
  - source: /locales/templates/*.pot
    translation: /locales/%locale%/%file_name%.po
    # Crowdin locale codes: es-MX for Mexican Spanish. %locale% keeps the region.
