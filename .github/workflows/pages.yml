# Publishes site/ to GitHub Pages. Pages can serve a branch root or /docs, and this
# site lives in site/, so the deployment runs from Actions instead.
# Turn it on once: Settings -> Pages -> Source: GitHub Actions.
# The page has no build step; site/status.json is committed, written by
# pipeline/tools/status.py.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
