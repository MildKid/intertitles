slug: sherlock-jr-1924
title: Sherlock, Jr.
year: 1924
director: Buster Keaton
production: Buster Keaton Productions; distributed by Metro Pictures
runtime_min: 45
rights: >
  Public domain in the United States (published 1924). Specific restorations may add
  copyrighted material (new scores, restoration credits); use a plain public-domain print.
synopsis: >
  A movie projectionist who studies to be a detective is framed for stealing a watch
  from his girl's father. Asleep in the booth, he dreams himself into the film on
  screen as the great detective Sherlock Jr. and solves the case there. Awake, the girl
  has already cleared him.
