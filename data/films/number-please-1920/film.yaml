slug: number-please-1920
title: Number, Please?
year: 1920
director: Hal Roach and Fred C. Newmeyer
production: Rolin Films; distributed by Pathé Exchange
runtime_min: 25
rights: >
  Public domain in the United States (published 1920). Use a plain public-domain print;
