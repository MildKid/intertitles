rights: >
  Public domain in the United States (published 1926). The film is still under copyright
  in Germany and much of the EU (director's life plus 70 years), so this project's output is
  for US screenings unless a rights check says otherwise. Restorations add copyrighted
  material (new scores, restoration credits); use a plain public-domain print.
synopsis: >
  Mephisto wagers with an archangel for the soul of the aged alchemist Faust, who trades his soul for youth and brings ruin on the girl he loves.
