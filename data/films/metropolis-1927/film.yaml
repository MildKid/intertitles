slug: metropolis-1927
title: Metropolis
year: 1927
director: Fritz Lang
production: UFA (Germany); original intertitles in German
runtime_min:            # blank until a print is chosen; runtimes differ by transfer
rights: >
  Public domain in the United States (published 1927). The film is still under copyright
  in Germany and much of the EU (director's life plus 70 years), so this project's output is
  for US screenings unless a rights check says otherwise. Restorations add copyrighted
  material (new scores, restoration credits); use a plain public-domain print.
synopsis: >
  In a city split between the masters above and the workers below, the master's son follows a preacher of peace underground while his father builds a false copy of her to break the workers.
